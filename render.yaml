# Render Blueprint for the Campus Portal API (Week 13, task A4).
# The service lives in backend/. Secrets are typed into the Render dashboard, never committed.
services:
  - type: web
    name: campus-portal-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Comma-separated exact origins. Add the Vercel URL here once the web app is deployed (A6).
      - key: CORS_ORIGIN
        value: https://group-11-campusportal.github.io,http://localhost:5173
