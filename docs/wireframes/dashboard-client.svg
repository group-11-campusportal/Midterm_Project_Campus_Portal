<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-label="Wireframe: client dashboard with profile card, statistics, grades and enrollments">
  <rect width="520" height="360" fill="#ffffff"/>
  <g font-family="system-ui, sans-serif">
    <rect x="0.5" y="0.5" width="519" height="359" fill="none" stroke="#cbd5e1"/>
    <rect x="0" y="0" width="520" height="30" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="12" y="20" font-size="9" fill="#64748b">header · role-aware menu · logged in as Client (Student)</text>
    <text x="24" y="58" font-size="16" font-weight="700" fill="#0f172a">Welcome back, Andi Pratama</text>
    <text x="24" y="74" font-size="9" fill="#94a3b8">Your enrollment summary and grades for this term.</text>
    <!-- profile card -->
    <rect x="24" y="88" width="150" height="232" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="38" y="110" font-size="10" font-weight="700" fill="#0f172a">My Profile</text>
    <g font-size="8" fill="#64748b">
      <text x="38" y="132">Name</text><text x="160" y="132" text-anchor="end" fill="#0f172a">Andi Pratama</text>
      <text x="38" y="156">Student ID</text><text x="160" y="156" text-anchor="end" fill="#0f172a">CS2023001</text>
      <text x="38" y="180">Program</text><text x="160" y="180" text-anchor="end" fill="#0f172a">Computer Science</text>
      <text x="38" y="204">Year</text><text x="160" y="204" text-anchor="end" fill="#0f172a">Year 3</text>
      <text x="38" y="228">Email</text><text x="160" y="228" text-anchor="end" fill="#0f172a">andi.p@…</text>
      <text x="38" y="252">Role</text><rect x="120" y="243" width="40" height="12" rx="6" fill="#eff4ff" stroke="#93c5fd"/><text x="140" y="252" text-anchor="middle" fill="#1d4ed8">client</text>
    </g>
    <line x1="38" y1="266" x2="160" y2="266" stroke="#e2e8f0"/>
    <text x="38" y="292" font-size="8" fill="#94a3b8">Changes with the logged-in user.</text>
    <!-- stats -->
    <g>
      <rect x="188" y="88" width="74" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="198" y="106" font-size="8" fill="#64748b">Enrolled</text><text x="198" y="124" font-size="15" font-weight="700" fill="#0f172a">2</text>
      <rect x="270" y="88" width="74" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="280" y="106" font-size="8" fill="#64748b">Approved</text><text x="280" y="124" font-size="15" font-weight="700" fill="#0f172a">1</text>
      <rect x="352" y="88" width="74" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="362" y="106" font-size="8" fill="#64748b">Pending</text><text x="362" y="124" font-size="15" font-weight="700" fill="#0f172a">1</text>
      <rect x="434" y="88" width="62" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="444" y="106" font-size="8" fill="#64748b">GPA</text><text x="444" y="124" font-size="15" font-weight="700" fill="#0f172a">3.67</text>
    </g>
    <!-- grades -->
    <rect x="188" y="146" width="308" height="88" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="200" y="166" font-size="10" font-weight="700" fill="#0f172a">My Grades</text>
    <line x1="200" y1="176" x2="484" y2="176" stroke="#cbd5e1"/>
    <g font-size="8" fill="#64748b"><text x="200" y="190">COURSE</text><text x="340" y="190">TERM</text><text x="400" y="190">CREDITS</text><text x="448" y="190">SCORE</text><text x="484" y="190" text-anchor="end">GRADE</text></g>
    <g font-size="9" fill="#334155">
      <text x="200" y="208">CS101 Intro to Programming</text><text x="340" y="208">2024/2025-2</text><text x="410" y="208">3</text><text x="455" y="208">88</text><text x="484" y="208" text-anchor="end">A</text>
      <text x="200" y="226">CS201 Data Structures</text><text x="340" y="226">2024/2025-2</text><text x="410" y="226">4</text><text x="455" y="226">79</text><text x="484" y="226" text-anchor="end">B+</text>
    </g>
    <!-- enrollments -->
    <rect x="188" y="244" width="308" height="76" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="200" y="264" font-size="10" font-weight="700" fill="#0f172a">My Enrollments</text>
    <line x1="200" y1="274" x2="484" y2="274" stroke="#cbd5e1"/>
    <g font-size="8" fill="#64748b"><text x="200" y="288">COURSE</text><text x="360" y="288">TERM</text><text x="484" y="288" text-anchor="end">STATUS</text></g>
    <g font-size="9" fill="#334155">
      <text x="200" y="306">CS201 Data Structures</text><text x="360" y="306">2025/2026-1</text>
      <text x="200" y="324">CS210 Discrete Mathematics</text><text x="360" y="324">2025/2026-1</text>
    </g>
    <rect x="430" y="297" width="52" height="12" rx="6" fill="#ecfdf3" stroke="#86efac"/><text x="456" y="306" font-size="8" fill="#16a34a" text-anchor="middle">approved</text>
    <rect x="430" y="315" width="52" height="12" rx="6" fill="#fff7ed" stroke="#fdba74"/><text x="456" y="324" font-size="8" fill="#d97706" text-anchor="middle">pending</text>
  </g>
</svg>
