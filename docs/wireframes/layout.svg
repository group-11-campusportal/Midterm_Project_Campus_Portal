<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-label="Wireframe: application shell with header, side menu, content and footer">
  <rect width="520" height="360" fill="#ffffff"/>
  <g font-family="system-ui, sans-serif">
    <rect x="0.5" y="0.5" width="519" height="359" fill="none" stroke="#cbd5e1"/>
    <!-- header -->
    <rect x="0" y="0" width="520" height="36" fill="#f1f5f9" stroke="#cbd5e1"/>
    <rect x="12" y="10" width="16" height="16" rx="4" fill="#2563eb"/>
    <text x="36" y="23" font-size="12" font-weight="700" fill="#0f172a">Campus Portal</text>
    <text x="392" y="22" font-size="10" fill="#64748b">Name · role</text>
    <rect x="452" y="9" width="56" height="18" rx="4" fill="none" stroke="#94a3b8"/>
    <text x="480" y="22" font-size="9" fill="#334155" text-anchor="middle">Log out</text>
    <!-- side menu -->
    <rect x="0" y="36" width="130" height="288" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="14" y="52" font-size="9" fill="#94a3b8">MENU</text>
    <rect x="12" y="60" width="106" height="22" rx="5" fill="#e0ebff" stroke="#2563eb"/>
    <text x="24" y="75" font-size="10" fill="#1d4ed8">Dashboard</text>
    <rect x="12" y="88" width="106" height="22" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="24" y="103" font-size="10" fill="#334155">Record Grade</text>
    <rect x="12" y="116" width="106" height="22" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="24" y="131" font-size="10" fill="#334155">Grade Records</text>
    <text x="14" y="300" font-size="8" fill="#94a3b8">(labels change with role)</text>
    <!-- content -->
    <text x="150" y="66" font-size="14" font-weight="700" fill="#0f172a">Page title</text>
    <text x="150" y="82" font-size="9" fill="#94a3b8">Page subtitle</text>
    <rect x="150" y="94" width="104" height="56" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="264" y="94" width="104" height="56" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="378" y="94" width="126" height="56" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="150" y="162" width="354" height="140" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="162" y="176" width="150" height="9" rx="3" fill="#e2e8f0"/>
    <rect x="162" y="200" width="330" height="1" fill="#e2e8f0"/>
    <rect x="162" y="212" width="330" height="9" rx="3" fill="#eef2f7"/>
    <rect x="162" y="232" width="330" height="9" rx="3" fill="#eef2f7"/>
    <rect x="162" y="252" width="330" height="9" rx="3" fill="#eef2f7"/>
    <rect x="162" y="272" width="330" height="9" rx="3" fill="#eef2f7"/>
    <!-- footer -->
    <rect x="0" y="324" width="520" height="36" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="14" y="345" font-size="9" fill="#64748b">University Campus Portal</text>
    <text x="506" y="345" font-size="9" fill="#94a3b8" text-anchor="end">Front-end demo · hardcoded data</text>
  </g>
</svg>
