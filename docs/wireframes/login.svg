<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-label="Wireframe: login page with brand panel and sign-in form">
  <rect width="520" height="360" fill="#ffffff"/>
  <g font-family="system-ui, sans-serif">
    <rect x="0.5" y="0.5" width="519" height="359" fill="none" stroke="#cbd5e1"/>
    <!-- brand panel -->
    <rect x="0" y="0" width="260" height="360" fill="#dbeafe" stroke="#cbd5e1"/>
    <rect x="24" y="130" width="34" height="34" rx="8" fill="#2563eb"/>
    <text x="24" y="196" font-size="20" font-weight="700" fill="#1e3a8a">Campus Portal</text>
    <text x="24" y="216" font-size="10" fill="#1e40af">One place for course enrollment and grades.</text>
    <!-- form panel -->
    <text x="292" y="96" font-size="17" font-weight="700" fill="#0f172a">Sign in</text>
    <text x="292" y="114" font-size="10" fill="#94a3b8">Enter your campus credentials.</text>
    <rect x="292" y="128" width="196" height="26" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="302" y="145" font-size="9" fill="#dc2626">Invalid username or password</text>
    <text x="292" y="172" font-size="9" font-weight="600" fill="#334155">Username</text>
    <rect x="292" y="176" width="196" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="292" y="216" font-size="9" font-weight="600" fill="#334155">Password</text>
    <rect x="292" y="220" width="196" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="292" y="258" width="196" height="30" rx="4" fill="#2563eb"/>
    <text x="390" y="277" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Sign in</text>
    <line x1="292" y1="304" x2="488" y2="304" stroke="#cbd5e1" stroke-dasharray="4 3"/>
    <text x="292" y="322" font-size="9" font-weight="600" fill="#334155">Demo accounts</text>
    <text x="292" y="338" font-size="9" fill="#64748b">Administrator — admin / admin123</text>
    <text x="292" y="352" font-size="9" fill="#64748b">Student — andi / student123</text>
  </g>
</svg>
