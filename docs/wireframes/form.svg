<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-label="Wireframe: form page for both roles — record grade and enroll in course">
  <rect width="520" height="360" fill="#ffffff"/>
  <g font-family="system-ui, sans-serif">
    <rect x="0.5" y="0.5" width="519" height="359" fill="none" stroke="#cbd5e1"/>
    <rect x="0" y="0" width="520" height="30" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="12" y="20" font-size="9" fill="#64748b">header · role-aware menu</text>

    <!-- Administrator variant -->
    <text x="24" y="58" font-size="13" font-weight="700" fill="#0f172a">Record a Grade</text>
    <text x="24" y="72" font-size="8" fill="#94a3b8">Administrator form</text>
    <rect x="24" y="82" width="228" height="196" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <g font-size="8" fill="#334155">
      <text x="36" y="102" font-weight="600">Student</text>
      <rect x="36" y="106" width="96" height="20" rx="4" fill="#fff" stroke="#cbd5e1"/><text x="42" y="120" fill="#94a3b8">Select student…</text>
      <text x="144" y="102" font-weight="600">Course</text>
      <rect x="144" y="106" width="96" height="20" rx="4" fill="#fff" stroke="#cbd5e1"/><text x="150" y="120" fill="#94a3b8">Select course…</text>
      <text x="36" y="146" font-weight="600">Raw Score (0–100)</text>
      <rect x="36" y="150" width="96" height="20" rx="4" fill="#fff" stroke="#cbd5e1"/><text x="42" y="164" fill="#94a3b8">e.g. 85</text>
      <text x="144" y="146" font-weight="600">Term</text>
      <rect x="144" y="150" width="96" height="20" rx="4" fill="#fff" stroke="#cbd5e1"/><text x="150" y="164" fill="#334155">2025/2026-1</text>
      <text x="36" y="188" fill="#64748b">Computed grade: B+ · 3.3 points</text>
      <rect x="36" y="200" width="76" height="24" rx="4" fill="#2563eb"/>
      <text x="74" y="216" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">Record Grade</text>
      <rect x="36" y="234" width="204" height="30" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
      <text x="42" y="253" fill="#dc2626">Error message shown here (validation)</text>
    </g>

    <!-- Client variant -->
    <text x="276" y="58" font-size="13" font-weight="700" fill="#0f172a">Enroll in a Course</text>
    <text x="276" y="72" font-size="8" fill="#94a3b8">Client (Student) form</text>
    <rect x="276" y="82" width="220" height="150" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <g font-size="8" fill="#334155">
      <text x="288" y="102" font-weight="600">Course</text>
      <rect x="288" y="106" width="196" height="20" rx="4" fill="#fff" stroke="#cbd5e1"/><text x="294" y="120" fill="#94a3b8">Select a course…</text>
      <text x="288" y="142" font-weight="600">Term</text>
      <rect x="288" y="146" width="196" height="20" rx="4" fill="#fff" stroke="#cbd5e1"/><text x="294" y="160" fill="#334155">2025/2026-1</text>
      <rect x="288" y="180" width="96" height="24" rx="4" fill="#2563eb"/>
      <text x="336" y="196" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">Submit Enrollment</text>
    </g>
    <rect x="276" y="242" width="220" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="288" y="258" font-size="8" font-weight="600" fill="#334155">Course Offerings (below the form)</text>
    <text x="288" y="272" font-size="8" fill="#94a3b8">Data table: code · title · credits · capacity</text>
  </g>
</svg>
