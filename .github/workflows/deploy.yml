# Builds the web admin app on every push to main and publishes dist/ to the
# gh-pages branch, which GitHub Pages already serves.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Baked into dist/ at build time (Vite). Without it the bundle calls http://127.0.0.1:3000.
          # Override with a repository variable API_URL if the backend moves.
          VITE_API_URL: ${{ vars.API_URL || 'https://midtermprojectcampusportal-production.up.railway.app' }}
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
